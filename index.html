<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Constituția Republicii Moldova</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #f0f4f8; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 920px; width: 100%; background: white; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); padding: 24px 20px; }
        h1 { font-size: 22px; color: #0b2d4b; border-bottom: 3px solid #2a7faa; padding-bottom: 10px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        h1 small { font-size: 15px; font-weight: 400; color: #3a5e7a; }
        .top-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
        .mode-selector { display: flex; gap: 10px; flex-wrap: wrap; flex: 1 1 auto; }
        .mode-selector button { padding: 10px 22px; border: 2px solid #2a7faa; background: white; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s; color: #2a7faa; flex: 1 1 auto; }
        .mode-selector button:hover { background: #e6f0f7; }
        .mode-selector button.active { background: #2a7faa; color: white; border-color: #2a7faa; }
        .lang-toggle { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #f0f0f0; cursor: pointer; border: 2px solid transparent; transition: 0.2s; user-select: none; font-size: 26px; line-height: 1; }
        .lang-toggle:hover { background: #e2e8f0; }
        .lang-toggle.active { border-color: #b22234; background: #fff0f0; }
        .ticket-selector { margin-bottom: 25px; }
        .ticket-selector label { font-weight: 600; display: block; margin-bottom: 10px; color: #1e3b5c; }
        .ticket-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .ticket-buttons button { padding: 12px 20px; border: 2px solid #2a7faa; background: white; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s; color: #2a7faa; flex: 0 0 calc(50% - 10px); min-width: 140px; position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .ticket-buttons button:hover { background: #e6f0f7; }
        .ticket-buttons button.completed-green { background: #a5d6a7; border-color: #2e7d32; color: #1e3b5c; }
        .ticket-buttons button.completed-yellow { background: #fff9c4; border-color: #f9a825; color: #1e3b5c; }
        .clear-progress-btn { padding: 10px 20px; border: 2px solid #dc3545; background: white; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; color: #dc3545; margin-top: 10px; }
        .clear-progress-btn:hover { background: #dc3545; color: white; }
        .progress-status { font-size: 14px; color: #28a745; margin-top: 10px; }
        .resume-btn { padding: 12px 28px; border: none; border-radius: 30px; background: #28a745; color: white; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .resume-btn:hover { background: #1e7e34; }
        .test-area { display: none; }
        .test-area.active { display: block; }
        .nav-panel { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; padding: 10px 8px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; max-height: 140px; overflow-y: auto; justify-content: center; }
        .nav-panel .qnum { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #cbd5e1; background: white; color: #1e3b5c; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.15s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .nav-panel .qnum:hover { border-color: #2a7faa; }
        .nav-panel .qnum.current { border-color: #2a7faa; background: #2a7faa; color: white; }
        .nav-panel .qnum.answered-correct { border-color: #2e7d32; background: #a5d6a7; color: #1e3b5c; }
        .nav-panel .qnum.answered-incorrect { border-color: #b22234; background: #f8d7da; color: #b22234; }
        .question-text { font-size: 18px; font-weight: 500; margin-bottom: 18px; color: #0b2d4b; line-height: 1.5; }
        .question-text .ru { display: block; font-weight: 400; font-size: 16px; color: #4a6a7a; margin-top: 6px; border-left: 3px solid #b22234; padding-left: 12px; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .option { display: flex; align-items: flex-start; background: #f9fbfd; padding: 14px 18px; border-radius: 12px; border: 2px solid #e2e8f0; cursor: pointer; transition: 0.15s; font-size: 16px; touch-action: manipulation; }
        .option:hover { border-color: #a0c4d9; }
        .option.correct { background: #d4edda; border-color: #28a745; }
        .option.incorrect { background: #f8d7da; border-color: #dc3545; }
        .option .opt-content { flex: 1; }
        .option .opt-content .ru { display: block; font-weight: 400; font-size: 15px; color: #4a6a7a; margin-top: 4px; border-left: 2px solid #b22234; padding-left: 10px; }
        .hint { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 12px 16px; margin-top: 10px; font-size: 15px; color: #856404; }
        .hint .ru { display: block; font-weight: 400; font-size: 14px; color: #856404; margin-top: 4px; border-left: 2px solid #b22234; padding-left: 10px; }
        .action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; justify-content: space-between; }
        .nav-btn { padding: 12px 28px; border: none; border-radius: 30px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; background: #e2e8f0; color: #1e3b5c; }
        .nav-btn:hover:not(:disabled) { background: #cbd5e1; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn.primary { background: #2a7faa; color: white; }
        .nav-btn.primary:hover:not(:disabled) { background: #1f648a; }
        .result-area { display: none; }
        .result-area.active { display: block; }
        .result-summary { background: #eaf4e8; padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .result-summary .score { font-size: 32px; font-weight: 700; color: #1e6b3b; }
        .result-item { border-bottom: 1px solid #e2e8f0; padding: 16px 0; }
        .result-item:last-child { border-bottom: none; }
        .result-item .q { font-weight: 500; margin-bottom: 6px; }
        .result-item .q .ru { font-weight: 400; font-size: 15px; color: #4a6a7a; margin-top: 4px; border-left: 3px solid #b22234; padding-left: 12px; }
        .result-item .your-answer { color: #b22234; }
        .result-item .correct-answer { color: #1e6b3b; }
        .result-item .answer-detail { margin-top: 4px; }
        .result-item .answer-detail .ru { font-weight: 400; font-size: 14px; color: #4a6a7a; border-left: 2px solid #b22234; padding-left: 10px; margin-top: 2px; }
        .result-item .status { font-weight: 600; margin-left: 10px; }
        .result-item .status.pass { color: #1e6b3b; }
        .result-item .status.fail { color: #b22234; }
        .result-item .status.unknown { color: #b68b40; }
        .result-actions { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px; }
        .result-actions button { padding: 12px 28px; border: none; border-radius: 30px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; flex: 1 0 auto; }
        .result-actions .btn-primary { background: #2a7faa; color: white; }
        .result-actions .btn-primary:hover { background: #1f648a; }
        .result-actions .btn-secondary { background: #e2e8f0; color: #1e3b5c; }
        .result-actions .btn-secondary:hover { background: #cbd5e1; }
        .footer-note { margin-top: 20px; font-size: 13px; color: #7a8a9a; border-top: 1px solid #e2e8f0; padding-top: 16px; }
        .footer-note code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
        @media (max-width: 600px) {
            .container { padding: 16px 12px; }
            h1 { font-size: 19px; }
            h1 small { font-size: 13px; }
            .mode-selector button { padding: 8px 14px; font-size: 14px; }
            .ticket-buttons button { flex: 0 0 calc(50% - 10px); min-width: 100px; padding: 10px 14px; font-size: 14px; }
            .nav-panel .qnum { width: 34px; height: 34px; font-size: 13px; }
            .question-text { font-size: 16px; }
            .option { padding: 12px 14px; font-size: 15px; }
            .nav-btn { padding: 10px 20px; font-size: 15px; }
            .result-summary .score { font-size: 28px; }
            .lang-toggle { width: 38px; height: 38px; font-size: 22px; }
        }
        @media (max-width: 400px) {
            .container { padding: 12px 8px; }
            .ticket-buttons button { flex: 0 0 100%; min-width: unset; }
            .nav-panel .qnum { width: 30px; height: 30px; font-size: 12px; }
            .question-text { font-size: 15px; }
            .option { padding: 10px 12px; font-size: 14px; }
            .nav-btn { padding: 8px 16px; font-size: 14px; }
            .lang-toggle { width: 34px; height: 34px; font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>
        📜 Examen – Constituția RM
        <small id="modeLabel">Bilete</small>
    </h1>

    <div class="top-bar">
        <div class="mode-selector">
            <button id="modeTickets" class="active">📂 Bilete</button>
            <button id="modeMarathon">🏃 Marafon</button>
            <button id="modeRandom">🎲 Aleatoriu</button>
        </div>
        <div class="lang-toggle" id="langToggle" title="Переключить русский перевод">🇷🇺</div>
    </div>

    <div id="ticketSelector" class="ticket-selector">
        <label>Alegeți biletul:</label>
        <div class="ticket-buttons" id="ticketButtons"></div>
        <div id="resumeContainer" style="margin-top:12px;"></div>
        <div id="progressStatus" class="progress-status"></div>
        <button class="clear-progress-btn" id="clearProgressBtn">🗑️ Șterge progresul</button>
    </div>

    <div id="testArea" class="test-area">
        <div class="nav-panel" id="navPanel"></div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div id="hintContainer"></div>
        <div class="action-buttons">
            <button class="nav-btn" id="prevQuestionBtn" disabled>← Înapoi</button>
            <button class="nav-btn primary" id="nextQuestionBtn">Înainte →</button>
        </div>
    </div>

    <div id="resultArea" class="result-area">
        <div id="resultSummary" class="result-summary"></div>
        <div id="resultList"></div>
        <div class="result-actions">
            <button class="btn-primary" id="retrySame">🔄 Reia același test</button>
            <button class="btn-secondary" id="goHome">🏠 Acasă</button>
        </div>
    </div>

    <div class="footer-note">
        ⚠️ Răspunsurile corecte și indicațiile sunt bazate pe textul Constituției.
    </div>
</div>

<script>
// ==================================================================
// ФУНКЦИЯ ОЧИСТКИ ТЕКСТА ОТ КОНЕЧНЫХ ЗНАКОВ ПРЕПИНАНИЯ
// ==================================================================
function cleanOption(text) {
    // Удаляем буквенный префикс (a), b), c) и т.д.)
    let cleaned = text.replace(/^[a-z]\)\s*/, '');
    // Удаляем конечные точки, точки с запятой, запятые, двоеточия и пробелы
    cleaned = cleaned.replace(/[.;:,]\s*$/, '').trim();
    return cleaned;
}

// ==================================================================
// ПОЛНЫЙ МАССИВ ИЗ 110 ВОПРОСОВ (с переводами и подсказками)
// ==================================================================
const questionsWithRu = [
    // Вопрос 1
    {
        id: 1,
        text: "Caracteristicile statului Republicii Moldova consacrate în Constituție sunt:",
        options: ["a) stat suveran, independent, social și inovațional;", "b) stat suveran, independent, unitar, indivizibil, de drept, democratic;", "c) stat suveran, independent, unitar descentralizat;", "d) stat suveran, independent, social și laic."],
        correct: 1,
        text_ru: "Характеристики государства Республика Молдова, закреплённые в Конституции:",
        options_ru: ["a) суверенное, независимое, социальное и инновационное государство;", "b) суверенное, независимое, унитарное, неделимое, правовое, демократическое государство;", "c) суверенное, независимое, унитарное децентрализованное государство;", "d) суверенное, независимое, социальное и светское государство."],
        hint: "Art. 1 din Constituție: Republica Moldova este un stat suveran, independent, unitar, indivizibil, de drept, democratic.",
        hint_ru: "Ст. 1 Конституции: Республика Молдова является суверенным, независимым, унитарным, неделимым, правовым, демократическим государством."
    },
    // Вопрос 2
    {
        id: 2,
        text: "Sub aspect administrativ, teritoriul Republicii Moldova este organizat în:",
        options: ["a) regiuni, raioane, orașe, sate, noduri de cale ferată, unitatea teritorială autonomă Găgăuzia;", "b) regiuni, raioane, orașe și sate;", "c) sate, orașe, raioane, unitatea teritorială autonomă Găgăuzia."],
        correct: 2,
        text_ru: "В административном отношении территория Республики Молдова организована в:",
        options_ru: ["a) регионы, районы, города, сёла, железнодорожные узлы, автономное территориальное образование Гагаузия;", "b) регионы, районы, города и сёла;", "c) сёла, города, районы, автономное территориальное образование Гагаузия."],
        hint: "Art. 110 alin. (1) din Constituție: teritoriul este organizat în sate, orașe, raioane și unitatea teritorială autonomă Găgăuzia.",
        hint_ru: "Ст. 110 ч. (1) Конституции: территория организована в сёла, города, районы и автономное территориальное образование Гагаузия."
    },
    // Вопрос 3
    {
        id: 3,
        text: "Care din următoarele îndatoriri nu este consacrată în Constituția Republicii Moldova:",
        options: ["a) devotament față de țară;", "b) conservarea și ocrotirea monumentelor istorice și culturale;", "c) îndatorirea de a munci."],
        correct: 2,
        text_ru: "Какая из следующих обязанностей не закреплена в Конституции Республики Молдова:",
        options_ru: ["a) преданность Родине;", "b) сохранение и охрана исторических и культурных памятников;", "c) обязанность трудиться."],
        hint: "Constituția prevede dreptul la muncă (art. 38), dar nu stabilește obligația de a munci.",
        hint_ru: "Конституция предусматривает право на труд (ст. 38), но не устанавливает обязанности трудиться."
    },
    // Вопрос 4
    {
        id: 4,
        text: "Poporul Republicii Moldova exercită suveranitatea:",
        options: ["a) prin organele sale reprezentative, prin referendum și prin adunările cetățenilor;", "b) prin organele sale reprezentative, prin referendum și prin Adunarea Națională;", "c) în mod direct și prin organele sale reprezentative, în formele stabilite de Constituție;", "d) în mod direct și prin organele sale reprezentative, în modul stabilit de Codul electoral."],
        correct: 2,
        text_ru: "Народ Республики Молдова осуществляет суверенитет:",
        options_ru: ["a) через свои представительные органы, путём референдума и собраний граждан;", "b) через свои представительные органы, путём референдума и Национального собрания;", "c) непосредственно и через свои представительные органы, в формах, установленных Конституцией;", "d) непосредственно и через свои представительные органы, в порядке, установленном Избирательным кодексом."],
        hint: "Art. 2 alin. (2) din Constituție: suveranitatea se exercită direct și prin organe reprezentative, în formele stabilite de Constituție.",
        hint_ru: "Ст. 2 ч. (2) Конституции: суверенитет осуществляется непосредственно и через представительные органы в формах, установленных Конституцией."
    },
    // Вопрос 5
    {
        id: 5,
        text: "În Republica Moldova percheziționarea, reținerea sau arestarea unei persoane sunt premise:",
        options: ["a) numai în cazul săvârșirii unei infracțiuni;", "b) numai în cazurile și cu procedura prevăzute de lege;", "c) numai în cazul săvârșirii unei contravenții, în baza mandatului emis de instanța de judecată;", "d) numai în cazul în care este nevoie de identificare, cu procedura prevăzută de lege."],
        correct: 1,
        text_ru: "Обыск, задержание или арест лица в Республике Молдова допускаются:",
        options_ru: ["a) только в случае совершения преступления;", "b) только в случаях и с процедурой, предусмотренными законом;", "c) только в случае совершения правонарушения, на основании ордера, выданного судебной инстанцией;", "d) только в случае необходимости идентификации, с процедурой, предусмотренной законом."],
        hint: "Art. 25 alin. (2) din Constituție: percheziționarea, reținerea sau arestarea sunt permise numai în cazurile și cu procedura prevăzute de lege.",
        hint_ru: "Ст. 25 ч. (2) Конституции: обыск, задержание или арест допускаются только в случаях и с процедурой, предусмотренными законом."
    },
    // Вопрос 6
    {
        id: 6,
        text: "Membrii Guvernului Republicii Moldova depun jurământul în fața:",
        options: ["a) Parlamentului;", "b) Curții Constituționale;", "c) Președintelui Republicii Moldova;", "d) Parlamentului și a Curții Constituționale."],
        correct: 0,
        text_ru: "Члены Правительства Республики Молдова приносят присягу перед:",
        options_ru: ["a) Парламентом;", "b) Конституционным судом;", "c) Президентом Республики Молдова;", "d) Парламентом и Конституционным судом."],
        hint: "Art. 99 alin. (1) din Constituție: membrii Guvernului depun jurământul în fața Parlamentului.",
        hint_ru: "Ст. 99 ч. (1) Конституции: члены Правительства приносят присягу перед Парламентом."
    },
    // Вопрос 7 (исправлен – добавлен вариант d)
    {
        id: 7,
        text: "Conform Constituției Republicii Moldova, cetățenii au dreptul să se adreseze autorităților publice prin petiții:",
        options: ["a) doar în cazul în care sunt întocmite în limba română;", "b) doar în cazul în care sunt formulate în numele semnatarilor;", "c) doar în cazul în care sunt încălcate anumite drepturi;", "d) fără restricții, în condițiile legii."],
        correct: 3,
        text_ru: "Согласно Конституции Республики Молдова, граждане имеют право обращаться в публичные органы с петициями:",
        options_ru: ["a) только если они составлены на румынском языке;", "b) только если они составлены от имени подписавшихся;", "c) только в случае нарушения определённых прав;", "d) без ограничений, в условиях, предусмотренных законом."],
        hint: "Art. 52 din Constituție garantează dreptul de petiționare fără restricții de limbă sau formă, cu excepția celor prevăzute de lege.",
        hint_ru: "Ст. 52 Конституции гарантирует право на петиции без ограничений по языку или форме, кроме случаев, предусмотренных законом."
    },
    // Вопрос 8
    {
        id: 8,
        text: "Avocatul Poporului din Republica Moldova poate fi revocat din funcție:",
        options: ["a) la cererea Președintelui Republicii Moldova;", "b) prin hotărârea Parlamentului, adoptată cu votul a 2/3 din deputații aleși;", "c) la cererea Consiliului Superior al Magistraturii, cu votul a 2/3 din membri."],
        correct: 1,
        text_ru: "Народный адвокат (Омбудсмен) Республики Молдова может быть отстранён от должности:",
        options_ru: ["a) по требованию Президента Республики Молдова;", "b) постановлением Парламента, принятым голосами 2/3 избранных депутатов;", "c) по требованию Высшего совета магистратуры, голосами 2/3 членов."],
        hint: "Legea cu privire la Avocatul Poporului prevede revocarea de către Parlament cu votul a 2/3 din deputații aleși.",
        hint_ru: "Закон о Народном адвокате предусматривает отстранение Парламентом голосами 2/3 избранных депутатов."
    },
    // Вопрос 9
    {
        id: 9,
        text: "Alegerile deputaților în Parlamentul Republicii Moldova se desfășoară:",
        options: ["a) în cel mult 2 luni de la expirarea mandatului sau de la dizolvarea Parlamentului precedent;", "b) în cel mult 90 de zile de la dizolvarea Parlamentului precedent;", "c) în cel mult 60 de zile de la expirarea mandatului;", "d) în cel mult 3 luni de la expirarea mandatului sau de la dizolvarea Parlamentului precedent."],

// ЛОГИКА ПРИЛОЖЕНИЯ (с очисткой текста опций)
// ==================================================================
const app = {
    mode: 'tickets',
    tickets: [],
    currentTicketIndex: null,
    currentQuestions: [],
    shuffledOptions: [],
    answers: [],
    currentIndex: 0,
    showRussian: false,
    autoTimer: null,
    isResuming: false,
    ticketStats: {},

    // Очистка опции: удаляем префикс и конечные знаки препинания
    cleanOption(text) {
        let cleaned = text.replace(/^[a-z]\)\s*/, '');
        cleaned = cleaned.replace(/[.;:,]\s*$/, '').trim();
        return cleaned;
    },

    init() {
        this.loadTicketStats();
        this.buildTickets();
        this.renderTicketButtons();
        this.bindEvents();
        this.setMode('tickets');
        document.getElementById('langToggle').addEventListener('click', () => {
            this.showRussian = !this.showRussian;
            document.getElementById('langToggle').classList.toggle('active', this.showRussian);
            this.saveProgress();
            if (document.getElementById('testArea').classList.contains('active')) {
                this.renderQuestion();
            } else if (document.getElementById('resultArea').classList.contains('active')) {
                this.showResults();
            }
        });
        this.checkSavedProgress();
    },

    loadTicketStats() {
        try {
            const saved = localStorage.getItem('ticketStats');
            if (saved) this.ticketStats = JSON.parse(saved);
        } catch (e) {}
    },

    saveTicketStats() {
        try {
            localStorage.setItem('ticketStats', JSON.stringify(this.ticketStats));
        } catch (e) {}
    },

    buildTickets() {
        this.tickets = [];
        const size = 10;
        for (let i = 0; i < 11; i++) {
            const start = i * size;
            const end = start + size;
            const qs = questionsWithRu.slice(start, end);
            this.tickets.push({ id: i+1, questions: qs });
        }
    },

    setMode(mode) {
        if (this.mode === mode && mode === 'tickets') {
            document.getElementById('ticketSelector').style.display = 'block';
            document.getElementById('testArea').classList.remove('active');
            document.getElementById('resultArea').classList.remove('active');
            this.renderTicketButtons();
            this.updateProgressStatus();
            return;
        }
        if (this.mode === mode && mode !== 'tickets') return;

        if (this.currentQuestions.length > 0) this.cleanupTest();

        this.mode = mode;
        document.getElementById('modeLabel').textContent = (mode === 'tickets') ? 'Bilete' : (mode === 'marathon' ? 'Marafon' : 'Aleatoriu');
        document.getElementById('modeTickets').classList.toggle('active', mode === 'tickets');
        document.getElementById('modeMarathon').classList.toggle('active', mode === 'marathon');
        document.getElementById('modeRandom').classList.toggle('active', mode === 'random');

        document.getElementById('ticketSelector').style.display = (mode === 'tickets') ? 'block' : 'none';
        document.getElementById('testArea').classList.remove('active');
        document.getElementById('resultArea').classList.remove('active');

        if (mode === 'tickets') {
            this.renderTicketButtons();
            this.updateProgressStatus();
        } else if (mode === 'marathon') {
            this.startMarathon();
        } else if (mode === 'random') {
            this.startRandom();
        }
    },

    cleanupTest() {
        this.currentQuestions = [];
        this.shuffledOptions = [];
        this.answers = [];
        this.currentIndex = 0;
        if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
        this.clearProgress();
        this.updateProgressStatus();
    },

    renderTicketButtons() {
        const container = document.getElementById('ticketButtons');
        container.innerHTML = '';
        this.tickets.forEach((t, idx) => {
            const btn = document.createElement('button');
            btn.textContent = `Biletul ${t.id}`;
            const stats = this.ticketStats[t.id];
            if (stats) {
                const percent = Math.round((stats.correct / stats.total) * 100);
                if (stats.correct === stats.total) {
                    btn.classList.add('completed-green');
                    btn.textContent += ` ✅ 100%`;
                } else {
                    btn.classList.add('completed-yellow');
                    btn.textContent += ` 🟡 ${percent}%`;
                }
            }
            btn.dataset.index = idx;
            btn.addEventListener('click', () => {
                this.startTicket(idx);
                this.saveProgress();
            });
            container.appendChild(btn);
        });
        this.updateProgressStatus();
    },

    startTicket(index) {
        this.currentTicketIndex = index;
        const ticket = this.tickets[index];
        const shuffledQs = this.shuffleArray([...ticket.questions]);
        this.currentQuestions = shuffledQs;
        this.shuffledOptions = shuffledQs.map(q => {
            const opts = this.shuffleArray([...q.options]);
            const correctText = q.options[q.correct];
            const newCorrect = opts.indexOf(correctText);
            return { options: opts, correct: newCorrect, options_ru: q.options_ru ? this.shuffleArray([...q.options_ru]) : [] };
        });
        this.answers = shuffledQs.map(() => ({ 
            selected: -1, 
            isCorrect: false, 
            wasIncorrect: false, 
            showHint: false, 
            firstWrongSelected: -1,
            incorrectIndices: []
        }));
        this.currentIndex = 0;
        this.showTest();
        this.saveProgress();
    },

    startMarathon() {
        const shuffledQs = this.shuffleArray([...questionsWithRu]);
        this.currentQuestions = shuffledQs;
        this.shuffledOptions = shuffledQs.map(q => {
            const opts = this.shuffleArray([...q.options]);
            const correctText = q.options[q.correct];
            const newCorrect = opts.indexOf(correctText);
            return { options: opts, correct: newCorrect, options_ru: q.options_ru ? this.shuffleArray([...q.options_ru]) : [] };
        });
        this.answers = shuffledQs.map(() => ({ 
            selected: -1, 
            isCorrect: false, 
            wasIncorrect: false, 
            showHint: false, 
            firstWrongSelected: -1,
            incorrectIndices: []
        }));
        this.currentIndex = 0;
        this.showTest();
        this.saveProgress();
    },

    startRandom() {
        const shuffledAll = this.shuffleArray([...questionsWithRu]);
        const selected = shuffledAll.slice(0, 10);
        this.currentQuestions = selected;
        this.shuffledOptions = selected.map(q => {
            const opts = this.shuffleArray([...q.options]);
            const correctText = q.options[q.correct];
            const newCorrect = opts.indexOf(correctText);
            return { options: opts, correct: newCorrect, options_ru: q.options_ru ? this.shuffleArray([...q.options_ru]) : [] };
        });
        this.answers = selected.map(() => ({ 
            selected: -1, 
            isCorrect: false, 
            wasIncorrect: false, 
            showHint: false, 
            firstWrongSelected: -1,
            incorrectIndices: []
        }));
        this.currentIndex = 0;
        this.showTest();
        this.saveProgress();
    },

    showTest() {
        document.getElementById('ticketSelector').style.display = 'none';
        document.getElementById('testArea').classList.add('active');
        document.getElementById('resultArea').classList.remove('active');
        this.renderNav();
        this.renderQuestion();
        this.updateNavButtons();
    },

    renderNav() {
        const panel = document.getElementById('navPanel');
        panel.innerHTML = '';
        const total = this.currentQuestions.length;
        for (let i=0; i<total; i++) {
            const btn = document.createElement('div');
            btn.className = 'qnum';
            btn.textContent = i+1;
            const state = this.answers[i];
            if (i === this.currentIndex) btn.classList.add('current');
            if (state.selected !== -1) {
                if (state.wasIncorrect) btn.classList.add('answered-incorrect');
                else if (state.isCorrect) btn.classList.add('answered-correct');
            }
            btn.dataset.index = i;
            btn.addEventListener('click', () => {
                this.currentIndex = i;
                if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
                this.renderNav();
                this.renderQuestion();
                this.updateNavButtons();
                this.saveProgress();
            });
            panel.appendChild(btn);
        }
    },

    renderQuestion() {
        const idx = this.currentIndex;
        const q = this.currentQuestions[idx];
        const opts = this.shuffledOptions[idx].options;
        const optsRu = this.shuffledOptions[idx].options_ru || [];
        const state = this.answers[idx];
        const correctIdx = this.shuffledOptions[idx].correct;

        const qTextDiv = document.getElementById('questionText');
        qTextDiv.innerHTML = `<span>${q.text}</span>`;
        if (this.showRussian && q.text_ru) {
            qTextDiv.innerHTML += `<span class="ru">${q.text_ru}</span>`;
        }

        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        opts.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option';
            // Очищаем текст опции
            const cleanOpt = this.cleanOption(opt);
            const cleanOptRu = this.cleanOption(optsRu[i] || '');

            if (state.incorrectIndices.includes(i)) {
                div.classList.add('incorrect');
            }
            if (state.selected === i && state.isCorrect) {
                div.classList.add('correct');
            }
            if (state.selected === i && !state.isCorrect && !state.incorrectIndices.includes(i)) {
                div.classList.add('incorrect');
            }

            const num = i+1;
            const content = document.createElement('div');
            content.className = 'opt-content';
            content.innerHTML = `<span><strong>${num}.</strong> ${cleanOpt}</span>`;
            if (this.showRussian && cleanOptRu) {
                content.innerHTML += `<span class="ru"><strong>${num}.</strong> ${cleanOptRu}</span>`;
            }

            div.appendChild(content);

            div.addEventListener('click', (e) => {
                const currentIdx = this.currentIndex;
                const currentState = this.answers[currentIdx];
                if (currentState.isCorrect) return;

                if (this.autoTimer) {
                    clearTimeout(this.autoTimer);
                    this.autoTimer = null;
                }

                if (currentState.selected === i) return;

                const isCorrect = (i === correctIdx);
                if (!isCorrect) {
                    if (!currentState.incorrectIndices.includes(i)) {
                        currentState.incorrectIndices.push(i);
                    }
                    if (currentState.firstWrongSelected === -1) {
                        currentState.firstWrongSelected = i;
                    }
                    currentState.wasIncorrect = true;
                    currentState.isCorrect = false;
                    currentState.showHint = true;
                } else {
                    currentState.isCorrect = true;
                    currentState.showHint = false;
                }
                currentState.selected = i;

                this.renderNav();
                this.renderQuestion();
                this.updateNavButtons();
                this.saveProgress();

                if (isCorrect) {
                    const allAnswered = this.answers.every(a => a.selected !== -1);
                    if (allAnswered) {
                        this.finishTest();
                    } else {
                        if (this.currentIndex < this.currentQuestions.length - 1) {
                            this.autoTimer = setTimeout(() => {
                                this.currentIndex++;
                                if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
                                this.renderNav();
                                this.renderQuestion();
                                this.updateNavButtons();
                                this.saveProgress();
                            }, 500);
                        }
                    }
                }
            });

            container.appendChild(div);
        });

        const hintDiv = document.getElementById('hintContainer');
        if (state.showHint && state.selected !== -1 && !state.isCorrect) {
            const hintText = q.hint || 'Consultați textul Constituției pentru a găsi răspunsul corect.';
            const hintTextRu = q.hint_ru || 'Обратитесь к тексту Конституции, чтобы найти правильный ответ.';
            let hintHtml = `<div class="hint">💡 ${hintText}`;
            if (this.showRussian && hintTextRu) {
                hintHtml += `<div class="ru">💡 ${hintTextRu}</div>`;
            }
            hintHtml += `</div>`;
            hintDiv.innerHTML = hintHtml;
        } else {
            hintDiv.innerHTML = '';
        }

        this.renderNav();
        this.updateNavButtons();
        this.saveProgress();
    },

    updateNavButtons() {
        const total = this.currentQuestions.length;
        document.getElementById('prevQuestionBtn').disabled = (this.currentIndex === 0);
        document.getElementById('nextQuestionBtn').disabled = (this.currentIndex === total - 1);
    },

    finishTest() {
        if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
        if (this.mode === 'tickets' && this.currentTicketIndex !== null) {
            const ticketId = this.tickets[this.currentTicketIndex].id;
            let correctFirst = 0;
            for (const ans of this.answers) {
                if (ans.isCorrect && !ans.wasIncorrect) correctFirst++;
            }
            this.ticketStats[ticketId] = {
                total: this.answers.length,
                correct: correctFirst
            };
            this.saveTicketStats();
            this.renderTicketButtons();
        }
        this.showResults();
        this.clearProgress();
        this.updateProgressStatus();
    },

    showResults() {
        document.getElementById('testArea').classList.remove('active');
        document.getElementById('resultArea').classList.add('active');

        const total = this.currentQuestions.length;
        let correctCount = 0;
        let unknownCount = 0;
        const items = [];

        for (let i=0; i<total; i++) {
            const q = this.currentQuestions[i];
            const opts = this.shuffledOptions[i].options;
            const optsRu = this.shuffledOptions[i].options_ru || [];
            const correctIdx = this.shuffledOptions[i].correct;
            const state = this.answers[i];
            const userAns = state.selected;
            let isCorrect = (state.isCorrect && !state.wasIncorrect);
            if (correctIdx === -1) {
                isCorrect = null;
                unknownCount++;
            } else if (isCorrect) {
                correctCount++;
            }
            let displayAnswer = userAns;
            if (state.wasIncorrect && state.firstWrongSelected !== -1) {
                displayAnswer = state.firstWrongSelected;
            }
            const cleanUserAnswer = displayAnswer !== -1 ? this.cleanOption(opts[displayAnswer]) : 'Neselctat';
            const cleanUserAnswerRu = (displayAnswer !== -1 && optsRu[displayAnswer]) ? this.cleanOption(optsRu[displayAnswer]) : '';
            const cleanCorrectAnswer = correctIdx !== -1 ? this.cleanOption(opts[correctIdx]) : 'Necunoscut';
            const cleanCorrectAnswerRu = (correctIdx !== -1 && optsRu[correctIdx]) ? this.cleanOption(optsRu[correctIdx]) : '';

            items.push({
                question: q.text,
                question_ru: q.text_ru || '',
                userAnswer: cleanUserAnswer,
                userAnswer_ru: cleanUserAnswerRu,
                correctAnswer: cleanCorrectAnswer,
                correctAnswer_ru: cleanCorrectAnswerRu,
                isCorrect: isCorrect
            });
        }

        const summaryDiv = document.getElementById('resultSummary');
        summaryDiv.innerHTML = `
            <div class="score">${correctCount} / ${total - unknownCount} corecte</div>
            <p>${unknownCount > 0 ? `${unknownCount} întrebări au răspuns necunoscut (verificați manual).` : ''}</p>
            <p>${total - unknownCount - correctCount} greșite</p>
        `;

        const listDiv = document.getElementById('resultList');
        listDiv.innerHTML = '';
        items.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'result-item';
            let statusText, statusClass;
            if (item.isCorrect === null) {
                statusText = '❓ Necunoscut';
                statusClass = 'unknown';
            } else if (item.isCorrect) {
                statusText = '✅ Corect';
                statusClass = 'pass';
            } else {
                statusText = '❌ Greșit';
                statusClass = 'fail';
            }

            let qHtml = `<strong>${idx+1}.</strong> ${item.question}`;
            if (this.showRussian && item.question_ru) {
                qHtml += `<div class="ru">${item.question_ru}</div>`;
            }
            let userHtml = `Răspunsul dvs.: ${item.userAnswer}`;
            if (this.showRussian && item.userAnswer_ru) {
                userHtml += `<div class="ru">${item.userAnswer_ru}</div>`;
            }
            let correctHtml = `Răspuns corect: ${item.correctAnswer}`;
            if (this.showRussian && item.correctAnswer_ru) {
                correctHtml += `<div class="ru">${item.correctAnswer_ru}</div>`;
            }

            div.innerHTML = `
                <div class="q">${qHtml}</div>
                <div class="your-answer answer-detail">${userHtml}</div>
                <div class="correct-answer answer-detail">${correctHtml}</div>
                <div class="status ${statusClass}">${statusText}</div>
            `;
            listDiv.appendChild(div);
        });

        document.getElementById('retrySame').onclick = () => this.retryTest();
        document.getElementById('goHome').onclick = () => this.goHome();
    },

    retryTest() {
        if (this.mode === 'tickets' && this.currentTicketIndex !== null) {
            this.startTicket(this.currentTicketIndex);
        } else if (this.mode === 'marathon') {
            this.startMarathon();
        } else if (this.mode === 'random') {
            this.startRandom();
        }
    },

    goHome() {
        this.cleanupTest();
        this.setMode('tickets');
    },

    shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    },

    saveProgress() {
        if (this.currentQuestions.length === 0 || this.isResuming) return;
        const data = {
            mode: this.mode,
            currentTicketIndex: this.currentTicketIndex,
            currentQuestions: this.currentQuestions,
            shuffledOptions: this.shuffledOptions,
            answers: this.answers,
            currentIndex: this.currentIndex,
            showRussian: this.showRussian
        };
        try {
            localStorage.setItem('testProgress', JSON.stringify(data));
            this.updateProgressStatus('saved');
        } catch (e) {}
    },

    loadProgress() {
        try {
            const raw = localStorage.getItem('testProgress');
            return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
    },

    clearProgress() {
        try {
            localStorage.removeItem('testProgress');
            this.updateProgressStatus('cleared');
        } catch (e) {}
    },

    checkSavedProgress() {
        const data = this.loadProgress();
        const container = document.getElementById('resumeContainer');
        if (data && data.currentQuestions && data.currentQuestions.length > 0) {
            const allAnswered = data.answers.every(a => a.selected !== -1);
            if (allAnswered) {
                this.clearProgress();
                this.updateProgressStatus('cleared');
                return;
            }
            container.innerHTML = `<button class="resume-btn" id="resumeBtn">▶️ Continuă testul</button>`;
            document.getElementById('resumeBtn').addEventListener('click', () => {
                this.isResuming = true;
                this.mode = data.mode;
                this.currentTicketIndex = data.currentTicketIndex;
                this.currentQuestions = data.currentQuestions;
                this.shuffledOptions = data.shuffledOptions;
                this.answers = data.answers;
                this.currentIndex = data.currentIndex;
                this.showRussian = data.showRussian || false;
                document.getElementById('langToggle').classList.toggle('active', this.showRussian);
                this.showTest();
                container.innerHTML = '';
                this.isResuming = false;
                this.updateProgressStatus('restored');
            });
            this.updateProgressStatus('exists');
        } else {
            container.innerHTML = '';
            this.updateProgressStatus('none');
        }
    },

    updateProgressStatus(status) {
        const statusDiv = document.getElementById('progressStatus');
        if (status === 'exists' || (this.loadProgress() && this.loadProgress().currentQuestions.length > 0)) {
            statusDiv.textContent = '💾 Progres salvat. Puteți continua testul.';
            statusDiv.style.color = '#28a745';
        } else if (status === 'saved') {
            statusDiv.textContent = '💾 Progres salvat.';
            statusDiv.style.color = '#28a745';
        } else if (status === 'cleared' || status === 'none') {
            statusDiv.textContent = '📁 Fără progres salvat.';
            statusDiv.style.color = '#6c757d';
        } else if (status === 'restored') {
            statusDiv.textContent = '✅ Progres restaurat. Continuați testul.';
            statusDiv.style.color = '#28a745';
        }
    },

    bindEvents() {
        document.getElementById('modeTickets').addEventListener('click', () => {
            this.setMode('tickets');
        });
        document.getElementById('modeMarathon').addEventListener('click', () => {
            this.setMode('marathon');
        });
        document.getElementById('modeRandom').addEventListener('click', () => {
            this.setMode('random');
        });

        document.getElementById('clearProgressBtn').addEventListener('click', () => {
            if (confirm('Sigur doriți să ștergeți progresul salvat?')) {
                this.clearProgress();
                this.updateProgressStatus('cleared');
                if (document.getElementById('testArea').classList.contains('active')) {
                    this.goHome();
                }
            }
        });

        document.getElementById('prevQuestionBtn').addEventListener('click', () => {
            if (this.currentIndex > 0) {
                this.currentIndex--;
                if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
                this.renderNav();
                this.renderQuestion();
                this.updateNavButtons();
                this.saveProgress();
            }
        });
        document.getElementById('nextQuestionBtn').addEventListener('click', () => {
            if (this.currentIndex < this.currentQuestions.length - 1) {
                this.currentIndex++;
                if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
                this.renderNav();
                this.renderQuestion();
                this.updateNavButtons();
                this.saveProgress();
            }
        });
    }
};

app.init();
</script>
